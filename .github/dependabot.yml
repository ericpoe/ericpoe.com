version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    react:
      patterns:
      - react
      - react-dom
    react-security:
      applies-to: security-updates
      patterns:
      - react
      - react-dom
    # Astro releases its packages together; one PR avoids lockfile rebase
    # races. @astrojs/check tracks TypeScript tooling, so it stays separate,
    # and majors stay separate so they get reviewed on their own.
    astro:
      patterns:
      - astro
      - "@astrojs/*"
      exclude-patterns:
      - "@astrojs/check"
      update-types:
      - minor
      - patch
    astro-security:
      applies-to: security-updates
      patterns:
      - astro
      - "@astrojs/*"
  ignore:
    # TS 7.0 dropped the classic Compiler API that @astrojs/language-server
    # and typescript-eslint depend on. Re-enable once they support it.
    - dependency-name: "typescript"
      update-types:
      - "version-update:semver-major"

  # Enable version updates for GitHub Actions
- package-ecosystem: "github-actions"
  # Workflow files stored in the default location of `.github/workflows`
  # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
  directory: "/"
  schedule:
    interval: "weekly"
